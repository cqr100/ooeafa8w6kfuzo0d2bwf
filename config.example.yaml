# mihomo 配置片段：引用 cqr100/mihomo-mrs-rules 生成的规则集
# 把 rule-providers 和 rules 两段合并进你自己的 config.yaml 即可。

rule-providers:
  mrs-emby:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: DIRECT            # 拉取规则集本身走直连，避免回环
    header:
      # 本仓库是私有的，raw 链接必须带 token（无鉴权返回 404）。
      # 建议单独建 Fine-grained token：只授权这一个仓库，权限只给 Contents: Read-only
      Authorization:
        - "token {YOUR_READONLY_PAT}"
    url: "https://raw.githubusercontent.com/cqr100/mihomo-mrs-rules/main/dist/emby.mrs"
    path: ./ruleset/mrs-emby.mrs

rules:
  - RULE-SET,mrs-emby,{你的Emby策略组}
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
